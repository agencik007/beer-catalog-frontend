# Production deploy via the Vercel CLI (the Vercel GitHub App is not installed).
#
# Required repository secrets — do not commit tokens:
#   VERCEL_TOKEN       Vercel access token
#   VERCEL_ORG_ID      team_peqVqe2v79Og4AILzWMz0edy
#   VERCEL_PROJECT_ID  prj_DonHoMF33KkFQI4eiuZdhjycMElh
#
# VITE_API_URL is already set on the Vercel project and is pulled before build.

name: Deploy

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add VERCEL_TOKEN, VERCEL_ORG_ID (team_peqVqe2v79Og4AILzWMz0edy), and VERCEL_PROJECT_ID (prj_DonHoMF33KkFQI4eiuZdhjycMElh)."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
